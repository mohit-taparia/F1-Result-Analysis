[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-modern-data-platform"
version = "0.2.0"
description = "Formula 1 data engineering, machine learning, and AI analytics platform"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.14,<1",
]
snowflake = [
  "snowflake-connector-python>=3.12,<5",
]
dbt = [
  "dbt-core==1.12.6",
  "dbt-snowflake==1.12.4",
]

[project.scripts]
f1-ingest = "f1_pipeline.main:main"
f1-load-snowflake = "f1_pipeline.warehouse_main:main"
f1-backfill-snowflake = "f1_pipeline.backfill_main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "live: integration tests that contact external services",
]


[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
