name: CI

on:
  push:
    branches:
      - feature/f1-modern-data-platform
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest -m "not live" -q

  live-api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Validate Jolpica API contract against completed 2024 season
        env:
          RUN_LIVE_F1_TESTS: "1"
        run: pytest tests/test_live_smoke.py -m live -q


  dbt-parse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dbt
        run: python -m pip install --upgrade pip && pip install -e ".[dbt]"

      - name: Parse dbt project
        run: dbt parse --project-dir dbt --profiles-dir .github/dbt --no-partial-parse
